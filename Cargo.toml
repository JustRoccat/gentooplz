[package]
name = "gentooplz"
version = "0.1.0"
edition = "2021"
description = "Are we there yet?"
license = "MIT"

[[bin]]
name = "gentooplz"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
