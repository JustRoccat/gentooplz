[package]
name = "gentooplz"
version = "0.3.1"
edition = "2024"
authors = ["JustRoccat"]
description = "Gentoo please... A terminal build monitor for Portage."
license = "MIT"
repository = "https://github.com/JustRoccat/gentooplz"
readme = "README.md"
keywords = ["gentoo", "portage", "tui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "gentooplz"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
sysinfo = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
rustix = { version = "1", features = ["process"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
