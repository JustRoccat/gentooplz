[package]
name = "gentooplz"
version = "0.2.0"
edition = "2021"
authors = ["JustRoccat"]
description = "Gentoo please... A terminal build monitor for Portage."
license = "MIT"
repository = "https://github.com/JustRoccat/gentooplz"
readme = "README.md"
keywords = ["gentoo", "portage", "tui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "gentooplz"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
